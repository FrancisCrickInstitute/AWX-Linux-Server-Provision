---
# Created by Adam Spandel, November 2026
# Purpose: Checks one approved network for an available Infoblox IP
# address without creating any Infoblox or VMware resources.

- name: Reset excluded addresses for candidate network
  ansible.builtin.set_fact:
    provision_auto_candidate_excluded_ips: []

- name: Build reserved address exclusion list
  ansible.builtin.set_fact:
    provision_auto_candidate_excluded_ips: >-
      {{
        provision_auto_candidate_excluded_ips
        + [
            (
              provision_auto_network_item.value.infoblox_network
              | regex_replace('\.0/24$', '.')
            )
            ~ item
          ]
      }}
  loop: >-
    {{
      range(
        provision_auto_infoblox_excluded_ip_start | int,
        (provision_auto_infoblox_excluded_ip_end | int) + 1
      ) | list
    }}

- name: Request next available IP from candidate network
  ansible.builtin.set_fact:
    provision_auto_candidate_ip: >-
      {{
        lookup(
          'infoblox.nios_modules.nios_next_ip',
          provision_auto_network_item.value.infoblox_network,
          exclude=provision_auto_candidate_excluded_ips,
          provider={
            'host': provision_auto_infoblox_host,
            'username': provision_infoblox_username,
            'password': provision_infoblox_password
          },
          errors='ignore'
        )
        | default([])
      }}

- name: Select first network with an available IP
  ansible.builtin.set_fact:
    provision_auto_vm_ip: "{{ provision_auto_candidate_ip[0] }}"
    provision_auto_vm_vlan: "{{ provision_auto_network_item.value.vlan }}"
    provision_auto_vm_network_name: "{{ provision_auto_network_item.key }}"
    provision_auto_vm_network: >-
      {{ provision_auto_network_item.value.infoblox_network }}
    provision_auto_vm_gateway: "{{ provision_auto_network_item.value.gateway }}"
    provision_auto_vm_netmask: "{{ provision_auto_network_item.value.netmask }}"
  when:
    - provision_auto_vm_ip is not defined
    - provision_auto_candidate_ip is sequence
    - provision_auto_candidate_ip | length > 0
