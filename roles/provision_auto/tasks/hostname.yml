---
# Created by Adam Spandel, November 2026
# Purpose: Derives the automatic Linux VM hostname prefix and performs
# read-only discovery of matching virtual machines in vCenter.

- name: Set automatic provisioning environment values
  ansible.builtin.set_fact:
    provision_auto_site_prefix: >-
      {{
        provision_auto_environments[vm_environment].site_prefix
      }}
    provision_auto_environment_code: >-
      {{
        provision_auto_environments[vm_environment].environment_code
      }}
    provision_auto_domain: >-
      {{
        provision_auto_environments[vm_environment].domain
      }}
    provision_auto_platform_environment: >-
      {{
        provision_auto_environments[vm_environment].platform_environment
      }}
    provision_auto_function_code: >-
      {{
        provision_auto_functions[vm_function]
      }}

- name: Build automatic hostname prefix
  ansible.builtin.set_fact:
    provision_auto_hostname_prefix: >-
      {{
        provision_auto_site_prefix
        ~ '-'
        ~ provision_auto_function_code
        ~ '-'
        ~ provision_auto_os_code
        ~ '-'
        ~ provision_auto_environment_code
        ~ '-'
      }}

- name: Set automatic provisioning vCenter
  ansible.builtin.set_fact:
    provision_auto_vcenter_host: >-
      {{
        provision_auto_vcenter[
          provision_auto_platform_environment
        ].vcenter_host
      }}
    provision_auto_vcenter_datacenter: >-
      {{
        provision_auto_vcenter[
          provision_auto_platform_environment
        ].datacenter
      }}

- name: Validate generated hostname prefix
  ansible.builtin.assert:
    that:
      - >-
        provision_auto_hostname_prefix is
        match('^clvd[01]-(if|db|dt|ap)-u-(d|t|p)-$')
    fail_msg: >-
      Generated hostname prefix
      '{{ provision_auto_hostname_prefix }}'
      does not match the expected Linux hostname convention.
    success_msg: >-
      Generated hostname prefix
      '{{ provision_auto_hostname_prefix }}'
      is valid.

- name: Gather virtual machines from vCenter
  community.vmware.vmware_vm_info:
    hostname: "{{ provision_auto_vcenter_host }}"
    username: "{{ provision_auto_vcenter_user }}"
    password: "{{ provision_vcenter_pass }}"
    validate_certs: "{{ provision_auto_vcenter_validate_certs }}"
    vm_type: vm
  register: provision_auto_vcenter_vm_info
  no_log: false

- name: Build list of existing vCenter VM names
  ansible.builtin.set_fact:
    provision_auto_existing_vm_names: >-
      {{
        provision_auto_vcenter_vm_info.virtual_machines
        | default([])
        | map(attribute='guest_name')
        | select('defined')
        | list
      }}

- name: Build list of matching automatic hostnames
  ansible.builtin.set_fact:
    provision_auto_matching_vm_names: >-
      {{
        provision_auto_existing_vm_names
        | select(
            'match',
            '^'
            ~ provision_auto_hostname_prefix
            ~ '[0-9]{2}$'
          )
        | sort
        | list
      }}

- name: Build automatic hostname candidates
  ansible.builtin.set_fact:
    provision_auto_hostname_candidates: >-
      {{
        query(
          'sequence',
          'start=' ~ (provision_auto_hostname_start | string),
          'end=' ~ (provision_auto_hostname_end | string),
          'format=%02d'
        )
        | map('regex_replace', '^', provision_auto_hostname_prefix)
        | list
      }}

- name: Determine available vCenter hostnames
  ansible.builtin.set_fact:
    provision_auto_available_vcenter_hostnames: >-
      {{
        provision_auto_hostname_candidates
        | difference(provision_auto_matching_vm_names)
        | list
      }}

- name: Validate available vCenter hostname exists
  ansible.builtin.assert:
    that:
      - provision_auto_available_vcenter_hostnames | length > 0
    fail_msg: >-
      No available hostname exists between
      {{ provision_auto_hostname_prefix }}01 and
      {{ provision_auto_hostname_prefix }}99.

- name: Select first available vCenter hostname
  ansible.builtin.set_fact:
    provision_auto_vm_name: >-
      {{
        provision_auto_available_vcenter_hostnames | first
      }}

- name: Build candidate VM FQDN
  ansible.builtin.set_fact:
    provision_auto_vm_fqdn: >-
      {{
        provision_auto_vm_name
        ~ '.'
        ~ provision_auto_domain
      }}

- name: Report automatic hostname discovery
  ansible.builtin.debug:
    msg:
      - "Environment: {{ vm_environment }}"
      - "Server function: {{ vm_function }}"
      - "Hostname prefix: {{ provision_auto_hostname_prefix }}"
      - "Domain: {{ provision_auto_domain }}"
      - "vCenter: {{ provision_auto_vcenter_host }}"
      - >-
        Matching existing VMs:
        {{
          provision_auto_matching_vm_names
          if provision_auto_matching_vm_names | length > 0
          else 'none'
        }}
      - >-
        Candidate range:
        {{ '%02d' | format(provision_auto_hostname_start | int) }}
        through
        {{ '%02d' | format(provision_auto_hostname_end | int) }}
      - >-
        First available vCenter hostname:
        {{ provision_auto_vm_name }}
      - >-
        Candidate FQDN:
        {{ provision_auto_vm_fqdn }}
