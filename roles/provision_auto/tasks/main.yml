---
# Created by Adam Spandel, November 2026
# Purpose: Defines the execution order for automatic Linux VM
# discovery, reservation and recovery.

- name: Validate automatic provisioning inputs
  ansible.builtin.import_tasks: validate.yml

- name: Resume existing automatic provisioning reservation
  ansible.builtin.import_tasks: resume.yml
  when:
    - provision_auto_resume_hostname is defined
    - provision_auto_resume_hostname | length > 0

- name: Determine first available Linux VM hostname
  ansible.builtin.import_tasks: hostname.yml
  when:
    - provision_auto_resume_hostname | default('') | length == 0

- name: Determine automatic Linux VM network and IP
  ansible.builtin.import_tasks: network.yml
  when:
    - provision_auto_resume_hostname | default('') | length == 0

- name: Reserve automatic Linux VM hostname and IP
  ansible.builtin.import_tasks: reserve_infoblox.yml
  when:
    - provision_auto_resume_hostname | default('') | length == 0

- name: Prepare automatic VMware provisioning
  ansible.builtin.import_tasks: prepare_vmware.yml
  when:
    - provision_auto_create_vm | bool
