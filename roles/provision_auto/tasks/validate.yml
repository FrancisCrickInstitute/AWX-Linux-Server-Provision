---
# Created by Adam Spandel, November 2026
# Purpose: Validates all survey inputs and configuration required for
# automatic Rocky Linux VM provisioning before infrastructure changes occur.

- name: Validate automatic provisioning survey variables
  ansible.builtin.assert:
    that:
      - vm_environment is defined
      - vm_environment | length > 0
      - vm_function is defined
      - vm_function | length > 0
      - servicenow_ticket is defined
      - servicenow_ticket | length > 0
      - bsn is defined
      - bsn | length > 0
      - vm_description is defined
      - vm_description | length > 0
      - owner is defined
      - owner | length > 0
    fail_msg: >-
      One or more required automatic provisioning variables are missing.
      Check vm_environment, vm_function, servicenow_ticket, bsn,
      vm_description and owner.

- name: Validate requested environment
  ansible.builtin.assert:
    that:
      - vm_environment in provision_auto_environments
    fail_msg: >-
      Unsupported environment '{{ vm_environment }}'.
      Supported environments are:
      {{ provision_auto_environments.keys() | list | join(', ') }}.

- name: Validate requested server function
  ansible.builtin.assert:
    that:
      - vm_function in provision_auto_functions
    fail_msg: >-
      Unsupported server function '{{ vm_function }}'.
      Supported functions are:
      {{ provision_auto_functions.keys() | list | join(', ') }}.

- name: Validate VM hardware values
  ansible.builtin.assert:
    that:
      - >-
        vm_num_cpus
        | default(provision_auto_vm_default_num_cpus)
        | int > 0
      - >-
        vm_memory_gb
        | default(provision_auto_vm_default_memory_gb)
        | int > 0
      - >-
        vm_disk_size_gb
        | default(provision_auto_vm_default_disk_size_gb)
        | int >= 20
    fail_msg: >-
      CPU and memory values must be greater than zero and the
      Rocky Linux operating system disk must be at least 20 GB.

- name: Validate hostname sequence range
  ansible.builtin.assert:
    that:
      - provision_auto_hostname_start | int >= 1
      - provision_auto_hostname_end | int <= 99
      - provision_auto_hostname_start | int
        <= provision_auto_hostname_end | int
    fail_msg: >-
      Automatic hostname sequence must be between 01 and 99.

- name: Validate automatic provisioning vCenter mapping
  ansible.builtin.assert:
    that:
      - >-
        provision_auto_environments[vm_environment].platform_environment
        in provision_auto_vcenter
    fail_msg: >-
      No vCenter mapping exists for environment
      '{{ vm_environment }}'.

- name: Validate automatic provisioning network pool
  ansible.builtin.assert:
    that:
      - >-
        provision_auto_networks
        | dict2items
        | selectattr(
            'value.environment',
            'defined'
          )
        | list
        | length > 0
    fail_msg: >-
      No approved automatic provisioning networks are configured.
