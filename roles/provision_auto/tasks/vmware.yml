---
# Created by Adam Spandel, November 2026
# Purpose: Provisions the automatically selected Rocky Linux VM in VMware
# using the validated hostname, Infoblox reservation and network mapping.

- name: Provision automatic VMware VM
  community.vmware.vmware_guest:
    validate_certs: "{{ provision_auto_vcenter_validate_certs }}"
    hostname: "{{ provision_auto_vcenter_host }}"
    username: "{{ provision_auto_vcenter_user }}"
    password: "{{ provision_vcenter_pass }}"
    name: "{{ provision_auto_vm_name }}"
    state: "{{ provision_auto_vm_state }}"
    template: "{{ provision_auto_vm_template }}"
    datacenter: "{{ provision_auto_vcenter_datacenter }}"
    cluster: "{{ provision_auto_vcenter_cluster }}"
    folder: "{{ provision_auto_vcenter_folder }}"
    datastore: "{{ provision_auto_vcenter_datastore }}"
    annotation: "{{ provision_auto_vm_annotation }}"
    wait_for_ip_address: "{{ provision_auto_vm_wait_for_ip_address }}"
    disk: "{{ provision_auto_vm_disks }}"
    hardware: "{{ provision_auto_vm_hardware }}"
    networks:
      - name: "{{ provision_auto_vm_vlan }}"
        type: static
        ip: "{{ provision_auto_vm_ip }}"
        netmask: "{{ provision_auto_vm_netmask }}"
        gateway: "{{ provision_auto_vm_gateway }}"
        connected: true
    customization:
      domain: "{{ provision_auto_domain }}"
      hostname: "{{ provision_auto_vm_name }}"
      dns_servers: "{{ provision_auto_vm_dns_servers }}"
  register: provision_auto_vmware_result

- name: Wait for automatic VM SSH availability
  ansible.builtin.wait_for:
    host: "{{ provision_auto_vm_ip }}"
    port: "{{ provision_auto_wait_port }}"
    timeout: "{{ provision_auto_wait_timeout }}"
    state: started

- name: Report automatic VMware provisioning
  ansible.builtin.debug:
    msg:
      - "VM: {{ provision_auto_vm_name }}"
      - "IP: {{ provision_auto_vm_ip }}"
      - "VLAN: {{ provision_auto_vm_vlan }}"
      - "vCenter: {{ provision_auto_vcenter_host }}"
      - "Cluster: {{ provision_auto_vcenter_cluster }}"
      - "Datastore: {{ provision_auto_vcenter_datastore }}"
