---
# Created by Adam Spandel, November 2026
# Purpose: Sends a Slack notification after successful automatic
# VMware VM provisioning.

- name: Prepare automatic provisioning Slack notification
  ansible.builtin.set_fact:
    provision_auto_slack_message: |-
      New server provisioned: {{ provision_auto_vm_fqdn }} - {{ provision_auto_vm_ip }}
      {{ provision_auto_vm_annotation }}

- name: Send automatic provisioning Slack notification
  community.general.slack:
    token: "{{ provision_slack_token }}"
    msg: "{{ provision_auto_slack_message }}"
    username: "{{ provision_auto_notification_username }}"
    color: good
    validate_certs: "{{ provision_auto_notification_validate_certs }}"
