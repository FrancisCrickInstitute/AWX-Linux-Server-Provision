---
# Created by Adam Spandel, November 2026
# Purpose: Sends a detailed Slack notification after successful
# automatic VMware VM provisioning.

- name: Prepare automatic provisioning Slack notification
  ansible.builtin.set_fact:
    provision_auto_slack_message: |-
      New Rocky Linux 10 server provisioned

      Hostname: {{ provision_auto_vm_fqdn }}
      IP: {{ provision_auto_vm_ip }}
      Network: {{ provision_auto_vm_vlan }}
      Environment: {{ vm_environment }}
      Function: {{ vm_function }}

      ServiceNow: {{ servicenow_ticket }}
      BSN: {{ bsn }}
      Description: {{ vm_description }}
      Owner: {{ owner }}
      Created: {{ now(utc=true, fmt='%Y-%m-%d') }}
      Provisioned by: {{ tower_user_name | default('ansible') }}

      CPU: {{ provision_auto_vm_hardware.num_cpus }}
      Memory: {{ vm_memory_gb | int }} GB
      OS Disk: {{ provision_auto_vm_disks[0].size_gb }} GB

- name: Send automatic provisioning Slack notification
  community.general.slack:
    token: "{{ provision_slack_token }}"
    msg: "{{ provision_auto_slack_message }}"
    username: "{{ provision_auto_notification_username }}"
    color: good
    validate_certs: "{{ provision_auto_notification_validate_certs }}"
