---
# Created by Adam Spandel, November 2026
# Purpose: Creates and validates the Infoblox host record selected by
# automatic hostname and network discovery.

- name: Create automatic Infoblox host record
  infoblox.nios_modules.nios_host_record:
    state: present
    name: "{{ provision_auto_vm_fqdn }}"
    ipv4:
      - address: "{{ provision_auto_vm_ip }}"
    comment: >-
      SN: {{ servicenow_ticket }} |
      Desc: {{ vm_description }} |
      Created: {{ now(utc=true, fmt='%Y-%m-%d') }} |
      By: {{ tower_user_name | default('ansible') }}
    provider:
      host: "{{ provision_auto_infoblox_host }}"
      username: "{{ provision_infoblox_username }}"
      password: "{{ provision_infoblox_password }}"
  register: provision_auto_infoblox_record_result
  when: provision_auto_create_infoblox_record | bool

- name: Verify automatic Infoblox host record
  ansible.builtin.set_fact:
    provision_auto_created_host_record: >-
      {{
        lookup(
          'infoblox.nios_modules.nios_lookup',
          'record:host',
          filter={
            'name': provision_auto_vm_fqdn
          },
          provider={
            'host': provision_auto_infoblox_host,
            'username': provision_infoblox_username,
            'password': provision_infoblox_password
          }
        )
      }}
  when: provision_auto_create_infoblox_record | bool

- name: Validate automatic Infoblox host record
  ansible.builtin.assert:
    that:
      - provision_auto_created_host_record is mapping
      - provision_auto_created_host_record.ipv4addrs is defined
      - provision_auto_created_host_record.ipv4addrs | length > 0
      - >-
        provision_auto_created_host_record.ipv4addrs[0].ipv4addr
        == provision_auto_vm_ip
    fail_msg: >-
      Infoblox host record {{ provision_auto_vm_fqdn }} was not
      created with expected address {{ provision_auto_vm_ip }}.
    success_msg: >-
      Infoblox host record {{ provision_auto_vm_fqdn }} was created
      successfully with address {{ provision_auto_vm_ip }}.
  when: provision_auto_create_infoblox_record | bool

- name: Report Infoblox reservation
  ansible.builtin.debug:
    msg:
      - "Hostname: {{ provision_auto_vm_name }}"
      - "FQDN: {{ provision_auto_vm_fqdn }}"
      - "IP address: {{ provision_auto_vm_ip }}"
      - "VLAN: {{ provision_auto_vm_vlan }}"
      - "Subnet: {{ provision_auto_vm_network }}"
  when: provision_auto_create_infoblox_record | bool
