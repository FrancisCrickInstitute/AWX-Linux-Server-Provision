---
# Created by Adam Spandel, November 2026
# Purpose: Exports automatically generated provisioning values so
# downstream AWX workflow nodes can use the new VM.

- name: Export automatic provisioning workflow variables
  ansible.builtin.set_stats:
    data:
      vm_name: "{{ provision_auto_vm_name }}"
      vm_ip: "{{ provision_auto_vm_ip }}"
      vm_fqdn: "{{ provision_auto_vm_fqdn }}"
      vm_vlan: "{{ provision_auto_vm_vlan }}"
    per_host: false

- name: Report exported workflow variables
  ansible.builtin.debug:
    msg:
      - "Exported vm_name: {{ provision_auto_vm_name }}"
      - "Exported vm_ip: {{ provision_auto_vm_ip }}"
      - "Exported vm_fqdn: {{ provision_auto_vm_fqdn }}"
      - "Exported vm_vlan: {{ provision_auto_vm_vlan }}"
