---
# Created by Adam Spandel, November 2026
# Purpose: Defines environment, server-function, vCenter and approved
# network mappings used by the automatic Linux VM provisioning role.

# -----------------------------------------------------------------------------
# Environment mappings
# -----------------------------------------------------------------------------

provision_auto_environments:
  Production:
    site_prefix: clvd1
    environment_code: p
    domain: thecrick.org
    platform_environment: Production

  Test:
    site_prefix: clvd0
    environment_code: t
    domain: thecrick.test
    platform_environment: Staging

  Development:
    site_prefix: clvd0
    environment_code: d
    domain: thecrick.test
    platform_environment: Staging

# -----------------------------------------------------------------------------
# Server function mappings
# -----------------------------------------------------------------------------

provision_auto_functions:
  Infrastructure: if
  Database: db
  Desktop: dt
  Application: ap
  Webserver: ws

# -----------------------------------------------------------------------------
# Approved automatic provisioning networks
# -----------------------------------------------------------------------------
#
# These VLAN/subnet mappings have been verified against existing VMs
# in vCenter.
#
# Automatic provisioning must only use networks belonging to the
# requested platform environment.
#
# The VMware VLAN and Infoblox subnet are defined together so that
# the allocated IP address can never be assigned to the wrong VLAN.
#
# Test and Development both use the Staging network pool.
# Production uses the Production network pool.
# -----------------------------------------------------------------------------

provision_auto_networks:
  DEV_960:
    vlan: DEV_960
    infoblox_network: 10.152.22.0/24
    gateway: 10.152.22.1
    netmask: 255.255.255.0
    environment: Staging

  DEV_961:
    vlan: DEV_961
    infoblox_network: 10.152.23.0/24
    gateway: 10.152.23.1
    netmask: 255.255.255.0
    environment: Staging

  DEV_962:
    vlan: DEV_962
    infoblox_network: 10.152.24.0/24
    gateway: 10.152.24.1
    netmask: 255.255.255.0
    environment: Staging

  DEV_965:
    vlan: DEV_965
    infoblox_network: 10.152.27.0/24
    gateway: 10.152.27.1
    netmask: 255.255.255.0
    environment: Staging

  PRD_611:
    vlan: PRD_611
    infoblox_network: 10.27.241.0/24
    gateway: 10.27.241.1
    netmask: 255.255.255.0
    environment: Production

  PRD_390:
    vlan: PRD_390

provision_auto_vcenter:
  Staging:
    cluster: "Dev-Cluster-01"
    datastore: "Pure-Dev-DSC"
    folder: "/NetApp-HCI-Dev/HCI_VMs/Servers/Linux_Dev"
    vcenter_host: "clvd1-vc-w-p-02.thecrick.org"
    datacenter: "NetApp-HCI-Datacenter-01"
    vm_template_folder: >-
      /NetApp-HCI-Datacenter-01/vm/NetApp-HCI-Prod/HCI_Templates

  Production:
    cluster: "Prod-Cluster-01"
    datastore: "Pure-Prod-DSC"
    folder: "/NetApp-HCI-Prod/HCI_VMs/HCI_Servers/HCI_Linux"
    vcenter_host: "clvd1-vc-w-p-02.thecrick.org"
    datacenter: "NetApp-HCI-Datacenter-01"
    vm_template_folder: >-
      /NetApp-HCI-Datacenter-01/vm/NetApp-HCI-Prod/HCI_Templates

provision_auto_templates:
  "Rocky 10":
    name: "template-rocky-10"
