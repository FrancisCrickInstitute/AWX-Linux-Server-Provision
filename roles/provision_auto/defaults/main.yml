---
# Created by Adam Spandel, November 2026
# Purpose: Defines configurable defaults used by the automatic Linux
# VM provisioning role.

# -----------------------------------------------------------------------------
# Automatic hostname allocation
# -----------------------------------------------------------------------------

# Hostname sequence range.
# The role selects the first available number, not the highest number + 1.

provision_auto_hostname_start: 1
provision_auto_hostname_end: 99

# Linux/Unix operating-system identifier used in Crick hostnames.

provision_auto_os_code: u

# -----------------------------------------------------------------------------
# vCenter
# -----------------------------------------------------------------------------

provision_auto_vcenter_user: svc-ansible-usr@vsphere.local
provision_auto_vcenter_validate_certs: false

# -----------------------------------------------------------------------------
# Infoblox
# -----------------------------------------------------------------------------

provision_auto_infoblox_host: ddi-automation.thecrick.org

# Reserve the first eleven addresses, .0 through .10, from automatic
# Infoblox IP allocation.
provision_auto_infoblox_excluded_ip_start: 0
provision_auto_infoblox_excluded_ip_end: 10


# -----------------------------------------------------------------------------
# Infrastructure change controls
# -----------------------------------------------------------------------------

# Remains false during discovery-only testing.
# Must be explicitly enabled to create an Infoblox host record.

provision_auto_create_infoblox_record: false

# -----------------------------------------------------------------------------
# VMware provisioning
# -----------------------------------------------------------------------------

provision_auto_create_vm: false

provision_auto_vm_state: poweredon
provision_auto_vm_wait_for_ip_address: true

provision_auto_operating_system: "Rocky 10"

provision_auto_vm_default_num_cpus: 1
provision_auto_vm_default_memory_gb: 2
provision_auto_vm_default_disk_size_gb: 20
provision_auto_vm_default_disk_type: thick

provision_auto_wait_port: 22
provision_auto_wait_timeout: 300

# -----------------------------------------------------------------------------
# Resume / recovery
# -----------------------------------------------------------------------------

# Optional hostname of an existing Infoblox reservation that has not yet
# been provisioned in VMware. Leave empty for normal automatic discovery.

provision_auto_resume_hostname: ""

# -----------------------------------------------------------------------------
# Notifications
# -----------------------------------------------------------------------------

provision_auto_notification_enabled: true
provision_auto_notification_username: "Ansible AWX"
provision_auto_notification_validate_certs: false
