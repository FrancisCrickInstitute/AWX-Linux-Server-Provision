---
# Created by Adam Spandel, October 2026
# Purpose: Defines infrastructure data used by the Linux VM provisioning role.
# Contains domain, network, template and vCenter placement mappings, together
# with Ansible Vault-encrypted credentials.

# -----------------------------------------------------------------------------
# Domains
# -----------------------------------------------------------------------------

provision_domain_dev: thecrick.test
provision_domain_prod: thecrick.org

provision_domain_dict:
  Staging: "{{ provision_domain_dev }}"
  Production: "{{ provision_domain_prod }}"
  GPUCluster: "{{ provision_domain_prod }}"

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
# ip_pattern is used to associate a resolved IP with the correct network.
# infoblox_network is the complete subnet supplied to Infoblox.
# -----------------------------------------------------------------------------

provision_networks:
  HPC_501:
    vlan: "HPC_501"
    ip_pattern: "10.28.8."
    infoblox_network: "10.28.8.0/24"
    gateway: "10.28.8.1"
    netmask: "255.255.255.0"
    domain: "{{ provision_domain_prod }}"
    environment: Production
    dns_servers:
      - "10.24.96.30"
      - "10.24.97.30"

