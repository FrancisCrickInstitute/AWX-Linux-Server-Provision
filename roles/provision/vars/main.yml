# -----------------------------------------------------------------------------
# VMware templates
# -----------------------------------------------------------------------------

provision_templates:
  "Rocky 10":
    name: "template-rocky-10"

# -----------------------------------------------------------------------------
# vCenter environment placement
# -----------------------------------------------------------------------------

provision_vcenter:
  Staging:
    cluster: "Dev-Cluster-01"
    datastore: "Pure-Dev-DSC"
    folder: "/NetApp-HCI-Dev/HCI_VMs/Servers/Linux_Dev"
    vcenter_host: "clvd1-vc-w-p-02.thecrick.org"
    vcenter_datacenter: "NetApp-HCI-Datacenter-01"
    vm_template_folder: >-
      /NetApp-HCI-Datacenter-01/vm/NetApp-HCI-Prod/HCI_Templates

  Production:
    cluster: "Prod-Cluster-01"
    datastore: "Pure-Prod-DSC"
    folder: "/NetApp-HCI-Prod/HCI_VMs/HCI_Servers/HCI_Linux"
    vcenter_host: "clvd1-vc-w-p-02.thecrick.org"
    vcenter_datacenter: "NetApp-HCI-Datacenter-01"
    vm_template_folder: >-
      /NetApp-HCI-Datacenter-01/vm/NetApp-HCI-Prod/HCI_Templates

  GPUCluster:
    cluster: "GPU-Supermicro-Cluster-01"
    datastore: "Pure-GPU-Datastore-Cluster-01"
    folder: "/GPU_VMs/Linux"
    vcenter_host: "clvd4-vc-a-p-01.thecrick.org"
    vcenter_datacenter: "Supermicro-GPU-Datacenter-01"
    vm_template_folder: >-
      /Supermicro-GPU-Datacenter-01/vm/LinuxTemplate

