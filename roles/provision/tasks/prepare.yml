---
# Created by Adam Spandel, October 2026
# Purpose: Derives the environment, vCenter placement, VM template,
# hardware specification, FQDN and annotation used during provisioning.

- name: Set normalised VM name
  ansible.builtin.set_fact:
    provision_vm_name: "{{ vm_name | lower }}"

- name: Determine VM environment
  ansible.builtin.set_fact:
    provision_platform_environment: "{{ item.environment }}"
  when: provision_vm_name is match(item.pattern)
  loop:
    - pattern: "^clvd0-[a-z]{2}-[a-z]-(d|t)-[0-9]{2}$"
      environment: Staging
    - pattern: "^clvd1-[a-z]{2}-[a-z]-p-[0-9]{2}$"
      environment: Production
    - pattern: "^clvd4-[a-z]{2}-[a-z]-p-[0-9]{2}$"
      environment: GPUCluster

- name: Validate derived VM environment
  ansible.builtin.assert:
    that:
      - provision_platform_environment is defined
      - provision_platform_environment in provision_vcenter
      - provision_platform_environment in provision_domain_dict
    fail_msg: >-
      Unable to determine a supported provisioning environment from
      hostname {{ provision_vm_name }}.

- name: Set VM FQDN
  ansible.builtin.set_fact:
    provision_vm_fqdn: >-
      {{
        provision_vm_name
        ~ '.'
        ~ provision_domain_dict[provision_platform_environment]
      }}

- name: Set vCenter placement
  ansible.builtin.set_fact:
    provision_vcenter_cluster: >-
      {{ provision_vcenter[provision_platform_environment].cluster }}
    provision_vcenter_datastore: >-
      {{ provision_vcenter[provision_platform_environment].datastore }}
    provision_vcenter_folder: >-
      {{ provision_vcenter[provision_platform_environment].folder }}
    provision_vcenter_host: >-
      {{ provision_vcenter[provision_platform_environment].vcenter_host }}
    provision_vcenter_datacenter: >-
      {{ provision_vcenter[provision_platform_environment].vcenter_datacenter }}
    provision_vm_template_folder: >-
      {{ provision_vcenter[provision_platform_environment].vm_template_folder }}

- name: Set VM hardware specification
  ansible.builtin.set_fact:
    provision_vm_disks:
      - size_gb: >-
          {{
            vm_disk_size_gb
            | default(provision_vm_default_disk_size_gb)
            | int
          }}
        type: >-
          {{
            vm_disk_type
            | default(provision_vm_default_disk_type)
          }}
    provision_vm_hardware:
      num_cpus: >-
        {{
          vm_num_cpus
          | default(provision_vm_default_num_cpus)
          | int
        }}
      memory_mb: >-
        {{
          vm_memory_mb
          | default(provision_vm_default_memory_mb)
          | int
        }}

- name: Validate requested operating system template
  ansible.builtin.assert:
    that:
      - provision_operating_system in provision_templates
    fail_msg: >-
      No VM template is configured for
      {{ provision_operating_system }}.

- name: Set VM template
  ansible.builtin.set_fact:
    provision_vm_template: >-
      {{
        provision_vm_template_folder
        ~ '/'
        ~ provision_templates[provision_operating_system].name
      }}

- name: Set VM annotation
  ansible.builtin.set_fact:
    provision_vm_annotation: |-
      SN: {{ servicenow_ticket }}
      OS: {{ provision_operating_system }}
      BSN: {{ bsn }}
      Desc: {{ vm_description }}
      [Owner={{ owner }}]
      Created on {{ ansible_date_time.date }} by {{ tower_user_name | default('ansible') }}
