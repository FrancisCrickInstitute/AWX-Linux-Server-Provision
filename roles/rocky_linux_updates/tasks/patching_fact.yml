---
# Created by Adam Spandel, October 2026
# Purpose: Records the timestamp of successful Rocky Linux patching in
# the existing Ansible local facts without overwriting other tags.
# lastPatching is updated only when package updates are actually applied.

- name: Ensure Ansible local facts directory exists
  ansible.builtin.file:
    path: "{{ rocky_linux_updates_custom_facts_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Refresh Ansible local facts before updating patching timestamp
  ansible.builtin.setup:
    filter:
      - ansible_local

- name: Read existing local tags
  ansible.builtin.set_fact:
    rocky_linux_updates_existing_tags: >-
      {{
        ansible_facts["ansible_local"]["tags"]
        | default({})
      }}

- name: Build current patching timestamp
  ansible.builtin.set_fact:
    rocky_linux_updates_patching_timestamp: >-
      {{
        ansible_facts["date_time"]["date"]
        ~ " "
        ~ ansible_facts["date_time"]["hour"]
        ~ ":"
        ~ ansible_facts["date_time"]["minute"]
      }}
  when:
    - rocky_linux_updates_apply_updates | bool
    - rocky_linux_updates_result is defined
    - rocky_linux_updates_result.changed | default(false) | bool

- name: Build updated local tags
  ansible.builtin.set_fact:
    rocky_linux_updates_updated_tags: >-
      {{
        rocky_linux_updates_existing_tags
        | combine(
            {
              rocky_linux_updates_patching_fact_name:
                rocky_linux_updates_patching_timestamp
            }
          )
      }}
  when:
    - rocky_linux_updates_apply_updates | bool
    - rocky_linux_updates_result is defined
    - rocky_linux_updates_result.changed | default(false) | bool

- name: Save updated local tags
  ansible.builtin.copy:
    content: "{{ rocky_linux_updates_updated_tags | to_nice_json }}\n"
    dest: "{{ rocky_linux_updates_local_tags_file }}"
    owner: root
    group: root
    mode: "0644"
  when:
    - rocky_linux_updates_apply_updates | bool
    - rocky_linux_updates_result is defined
    - rocky_linux_updates_result.changed | default(false) | bool

- name: Refresh Ansible local facts after patching
  ansible.builtin.setup:
    filter:
      - ansible_local

- name: Validate last patching fact
  ansible.builtin.assert:
    that:
      - ansible_facts["ansible_local"]["tags"] is defined
      - >-
        rocky_linux_updates_patching_fact_name
        in ansible_facts["ansible_local"]["tags"]
    fail_msg: >-
      The lastPatching local fact could not be validated.
    success_msg: >-
      The lastPatching local fact is
      {{
        ansible_facts["ansible_local"]["tags"][
          rocky_linux_updates_patching_fact_name
        ]
      }}.
