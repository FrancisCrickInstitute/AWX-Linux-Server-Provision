---
# Created by Adam Spandel, October 2026
# Purpose: Initialises the Splunk Universal Forwarder when required,
# deploys the managed systemd unit and ensures the service is running.

- name: Check whether Splunk has already been initialised
  ansible.builtin.stat:
    path: "{{ splunk_forwarder_home }}/etc/passwd"
  register: splunk_forwarder_initialised

- name: Deploy initial Splunk administrator credentials
  ansible.builtin.template:
    src: user-seed.conf.j2
    dest: "{{ splunk_forwarder_home }}/etc/system/local/user-seed.conf"
    owner: "{{ splunk_forwarder_user }}"
    group: "{{ splunk_forwarder_group }}"
    mode: "0600"
  when: not splunk_forwarder_initialised.stat.exists
  no_log: true

- name: Start Splunk for initialisation
  ansible.builtin.command:
    cmd: >-
      {{ splunk_forwarder_home }}/bin/splunk start
      --accept-license
      --answer-yes
      --no-prompt
  become: true
  timeout: "{{ splunk_forwarder_cli_timeout }}"
  when: not splunk_forwarder_initialised.stat.exists
  changed_when: true

- name: Stop Splunk after initialisation
  ansible.builtin.command:
    cmd: "{{ splunk_forwarder_home }}/bin/splunk stop"
  become: true
  timeout: "{{ splunk_forwarder_cli_timeout }}"
  when: not splunk_forwarder_initialised.stat.exists
  changed_when: true

- name: Deploy SplunkForwarder systemd service
  ansible.builtin.template:
    src: SplunkForwarder.service.j2
    dest: "{{ splunk_forwarder_systemd_unit }}"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd

- name: Apply pending systemd service changes
  ansible.builtin.meta: flush_handlers

- name: Ensure Splunk Forwarder is enabled and running
  ansible.builtin.systemd:
    name: "{{ splunk_forwarder_service }}"
    enabled: true
    state: started

- name: Gather Splunk Forwarder service facts
  ansible.builtin.service_facts:

- name: Validate Splunk Forwarder service
  ansible.builtin.assert:
    that:
      - >-
        ansible_facts.services[
          splunk_forwarder_service + ".service"
        ].state == "running"
      - >-
        ansible_facts.services[
          splunk_forwarder_service + ".service"
        ].status == "enabled"
    fail_msg: >-
      {{ splunk_forwarder_service }} is not running and enabled.
    success_msg: >-
      {{ splunk_forwarder_service }} is running and enabled.
