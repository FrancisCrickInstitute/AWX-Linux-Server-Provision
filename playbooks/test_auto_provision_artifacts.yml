---
# Created by Adam Spandel, November 2026
# Purpose: Validates automatic provisioning variables passed between
# AWX workflow nodes.

- name: Validate automatic provisioning workflow artifacts
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Validate received automatic provisioning variables
      ansible.builtin.assert:
        that:
          - vm_name is defined
          - vm_name | length > 0
          - vm_ip is defined
          - vm_ip | length > 0
          - vm_fqdn is defined
          - vm_fqdn | length > 0
          - vm_vlan is defined
          - vm_vlan | length > 0
        fail_msg: >-
          One or more automatic provisioning workflow variables were
          not received from the previous AWX workflow node.

    - name: Report received automatic provisioning variables
      ansible.builtin.debug:
        msg:
          - "Received vm_name: {{ vm_name }}"
          - "Received vm_ip: {{ vm_ip }}"
          - "Received vm_fqdn: {{ vm_fqdn }}"
          - "Received vm_vlan: {{ vm_vlan }}"
