---
# Created by Adam Spandel, November 2026
# Purpose: Tests the Rocky Linux provisioning Slack integration without
# creating or modifying infrastructure.

- name: Test Rocky Linux provisioning Slack notification
  hosts: localhost
  gather_facts: false

  vars_files:
    - ../roles/provision/vars/main.yml

  tasks:
    - name: Send Rocky Linux provisioning Slack test notification
      community.general.slack:
        token: "{{ provision_slack_token }}"
        channel: "C0BHW37EAMA"
        msg: |-
          Rocky Linux provisioning notification test

          This is a controlled AWX/Ansible test.
          No VM or infrastructure resources were created.

          Target channel: #ito-infra-notifications
          Sent by: {{ tower_user_name | default('ansible') }}
        username: "Ansible AWX"
        color: good
        validate_certs: false
      no_log: true
